version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: boutique_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_boutique
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Express Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: boutique_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: ecommerce_boutique
      DB_PORT: 3306
      JWT_SECRET: super_secret_jwt_key_boutique_2026
      PAYSTACK_SECRET: ${PAYSTACK_SECRET:-your_paystack_secret_key_here}
      CLIENT_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy

  # React Vite Frontend Service (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: boutique_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql_data:
